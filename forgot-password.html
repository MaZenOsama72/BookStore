<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>Forgot Password - BookStore</title>

</head>


<body>


<header>

    <nav class="navbar">

        <h1 class="logo">BookStore</h1>

        <ul class="nav-links">

            <li>
                <a href="index.html">Home</a>
            </li>

            <li>
                <a href="index.html#books">Books</a>
            </li>

            <li>
                <a href="index.html#categories">Categories</a>
            </li>

        </ul>

        <a href="login.html">
            <button class="login-btn">Login</button>
        </a>

    </nav>

</header>


<main>

    <section class="login-section">

        <div class="login-card">

            <h2>Forgot Password?</h2>

            <p class="login-intro">
                Enter your email address to reset your password
            </p>


            <form class="login-form" action="verify.html">

    <div class="form-group">

        <label for="email">
            Email Address
        </label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >

    </div>

    <button
        type="submit"
        class="login-submit"
    >
        Continue
    </button>

</form>


            <p class="register-text">

                Remember your password?

                <a href="login.html">
                    Login
                </a>

            </p>


            <a
                href="index.html"
                class="back-home"
            >
                ← Back to Home
            </a>


        </div>

    </section>

</main>


<footer>

    <p>
        © 2026 BookStore. All Rights Reserved.
    </p>

</footer>


</body>

</html>
