<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="../js/theme.js"></script>
    <link rel="stylesheet" href="../css/style.css">

    <title>Login - BookStore</title>

</head>


<body class="site-layout">


<header>

    <nav class="navbar">

        <h1 class="logo">BookStore</h1>

        <ul class="nav-links">

            <li>
                <a href="../index.html">Home</a>
            </li>

            <li>
                <a href="../index.html#books">Books</a>
            </li>

            <li>
                <a href="../index.html#categories">Categories</a>
            </li>

        </ul>

        <a class="login-btn" href="../index.html">Home</a>

    </nav>

</header>


<main>

    <section class="login-section">

        <div class="login-card">

            <h2>Welcome Back</h2>

            <p class="login-intro">
                Login to your BookStore account
            </p>


            <form class="login-form">


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <div class="login-options">

                    <label>
                        <input type="checkbox">
                        Remember Me
                    </label>

                    <a href="forgot-password.html">
                        Forgot Password?
                    </a>
                </div>


                <button
                    type="submit"
                    class="login-submit"
                >
                    Login
                </button>


            </form>


            <p class="register-text">

                <a href="register.html">
                     Create Account
                </a>
            </p>


            <a
                href="../index.html"
                class="back-home"
            >
                ← Back to Home
            </a>


        </div>

    </section>

</main>


<footer>

    <p>
        © 2026 BookStore. All Rights Reserved.
    </p>

</footer>

<script src="../js/script.js"></script>

</body>

</html>
