<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>Verify Account - BookStore</title>

</head>


<body>


<header>

    <nav class="navbar">

        <h1 class="logo">BookStore</h1>

        <ul class="nav-links">

            <li>
                <a href="index.html">Home</a>
            </li>

            <li>
                <a href="index.html#books">Books</a>
            </li>

            <li>
                <a href="index.html#categories">Categories</a>
            </li>

        </ul>

        <a href="login.html">
            <button class="login-btn">Login</button>
        </a>

    </nav>

</header>


<main>

    <section class="login-section">

        <div class="login-card">

            <h2>Verify Your Account</h2>

            <p class="login-intro">
                Enter the 6-digit verification code we sent to your email or phone.
            </p>


            <form class="login-form" action="reset-password.html">


                <div class="verification-code">

                    <input
                        type="text"
                        maxlength="1"
                        inputmode="numeric"
                        required
                    >

                    <input
                        type="text"
                        maxlength="1"
                        inputmode="numeric"
                        required
                    >

                    <input
                        type="text"
                        maxlength="1"
                        inputmode="numeric"
                        required
                    >

                    <input
                        type="text"
                        maxlength="1"
                        inputmode="numeric"
                        required
                    >

                    <input
                        type="text"
                        maxlength="1"
                        inputmode="numeric"
                        required
                    >

                    <input
                        type="text"
                        maxlength="1"
                        inputmode="numeric"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-submit"
                >
                    Verify
                </button>


            </form>


            <p class="register-text">

                Didn't receive the code?

                <a href="#">
                    Resend Code
                </a>

            </p>


            <a
                href="forgot-password.html"
                class="back-home"
            >
                ← Back
            </a>


        </div>

    </section>

</main>


<footer>

    <p>
        © 2026 BookStore. All Rights Reserved.
    </p>

</footer>


</body>

</html>
